[workspace]
resolver = "2"
members = ["crates/audorchid-core", "crates/audorchid-audio", "crates/audorchid-render", "crates/audorchid-export"]
exclude = ["vendor/fdk-aac"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
authors = ["ppisky <280739163+ppisky@users.noreply.github.com>"]
repository = "https://github.com/ppisky/Audorchid"
homepage = "https://github.com/ppisky/Audorchid"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
audorchid-core = { path = "crates/audorchid-core" }
audorchid-audio = { path = "crates/audorchid-audio" }
audorchid-render = { path = "crates/audorchid-render" }
gpui = { git = "https://github.com/cradiy/gpui-fusion", rev = "27d0daf84e4956f93aac222985e91181ff3d43b5", default-features = false, features = ["test-support"] }
gpui_wgpu = { git = "https://github.com/cradiy/gpui-fusion", rev = "27d0daf84e4956f93aac222985e91181ff3d43b5" }

[patch.crates-io]
fdk-aac = { path = "vendor/fdk-aac" }
# GPUI's scheduler relies on the fork's task metadata API.
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 8
